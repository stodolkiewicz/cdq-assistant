logging:
  level:
    com.cdq.assistant: DEBUG

spring:
  application:
    name: assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/assistant
    username: assistant
    password: assistant

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b
      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

    mcp:
      client:
        type: SYNC
        streamable-http:
          connections:
            countries:
              url: http://localhost:8081
              endpoint: /api/mcp/country-info
        stdio:
          connections:
            weather:
              command: docker
              args:
                - run
                - -i
                - --rm
                - -e
                - WEATHER_API_KEY=${WEATHER_API_KEY}
                - -e
                - WEATHER_API_URL=https://api.weatherapi.com/v1/current.json
                - mcp-weather-local

app:
  rag:
    chunking:
      # TokenTextSplitter — caps any oversized section to this many tokens
      max-chunk-size: 800
      # chunks shorter than this (in characters) get merged into a neighbor
      min-chunk-size-chars: 350
      # chunks shorter than this (in characters) are discarded, not embedded
      min-chunk-length-to-embed: 5
      # hard cap on the number of chunks produced from a single document
      max-num-chunks: 10000
      # MarkdownDocumentReader — splits by document structure before token-capping
      markdown-reader:
        # if true, a "---" horizontal rule starts a new section/chunk
        horizontal-rule-create-document: false

  chat:
    memory:
      # number of messages kept in the in-memory chat window before the oldest are dropped
      max-messages: 5
      # conversation id used when the client doesn't send one
      default-conversation-id: "1"
